<!DOCTYPE html>
<html>
    <head>
        <title>Kamil Jarocki - Portfolio</title>
        <link rel="icon" href="../icon.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../styles.css">
         <link rel="stylesheet" href="../css/fontello.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="page1">
            <div id="welcome">
                    <div class="welcomeHead">{welcome1}</div>
                    <div id='welcomeText'>{welcome2}</div>
                    <div id="theme" onclick="changeTheme()"><i class='icon-moon'></i></div>
                    
                    <div id='arrowBG' onclick="slideSidePage()"><div id="arrow">{about1}</div></div>
            </div>
            <div id="bg1" onClick="slideSidePageBack()"></div>
            <div id="sidePage">
                    <div class="welcomeHead">{about2}</div>
                    <div id="textWrapper">
                        <div class="columnText">
                            {infoText1}
                        </div>
                        <div class="columnText">
                            {infoText2}
                        </div>
                        <div id="zdjecie">
                            <img src="../zdjecie/zdjecie.png">
                        </div>
                    </div>
                    <div id='arrowBG' onclick="nextPage()"><div id="arrow">{projects}</div></div>
            </div>
        </div>
        <div id="page2">
            <div id="arrowBG" onclick="prevPage()"><div id="arrow"></div>&#8593;</div>
            <div id="projectContainer">
                <div id="projectRoot">
                        {PROJECT DATA}
                </div>
            </div>
            <div id="arrowBG" onclick="nextPage()"><div id="arrow">{contact}</div></div>
        </div>
        <div id="page3">
            <div id="arrowBG" onclick="prevPage()"><div id="arrow"></div>&#8593;</div>
            <div id="contact">

                <div id="card1">
                    <div class="padInside">
                        <div id="contactHead">{contact}</div>
                        <div id="contactMore"><a target="_blank" href="https://www.linkedin.com/in/kamil-jarocki-07487b403/"><i class='icon-linkedin-squared'></i></a><a target="_blank" href="https://github.com/kamijar20031"><i class='icon-github-circled'></i></a><a id="noRobots"><i class='icon-mail-alt'></i></a></div>
                    </div>

                </div>
                <div id="card2">
                    <div class="padInside"></div>
                </div>
            </div>
        </div>
    </body>
    <script src="../main.js"></script>
</html>
